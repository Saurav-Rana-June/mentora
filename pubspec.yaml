name: mentora
description: "A new Flutter project."
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.7.3
  google_fonts: ^6.3.2
  flutter_screenutil: ^5.9.3
  my_icons:
    git:
      url: https://github.com/Saurav-Rana-June/my_packages.git
      path: my_icons
      ref: main
  my_spacing:
    git:
      url: https://github.com/Saurav-Rana-June/my_packages.git
      path: my_spacing
      ref: my_spacing
  my_buttons:
    git:
      url: https://github.com/Saurav-Rana-June/my_packages.git
      path: my_buttons
      ref: my_buttons

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

assets:
  - assets/logos/
  - assets/images/
  - assets/moods/

fonts:
  - family: Satoshi
    fonts:
      - asset: assets/fonts/Satoshi-Regular.otf
      - asset: assets/fonts/Satoshi-Medium.otf
        weight: 500
      - asset: assets/fonts/Satoshi-Bold.otf
        weight: 700
  - family: FontAwesomeSolid
    fonts:
      - asset: assets/fonts/fa-solid-900.ttf
  - family: FontAwesomeRegular
    fonts:
      - asset: assets/fonts/fa-regular-400.ttf
  - family: FontAwesomeLight
    fonts:
      - asset: assets/fonts/fa-light-300.ttf
  - family: FontAwesomeBrands
    fonts:
      - asset: assets/fonts/fa-brands-400.ttf
